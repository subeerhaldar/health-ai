<div class="workflows-container">
  <div class="header-section">
    <h2>Active Workflows</h2>
    <button class="btn-primary">New Workflow</button>
  </div>

  <div class="workflows-grid">
    <div class="glass-card workflow-item">
      <div class="wf-header">
        <span class="icon">💊</span>
        <h4>Prescription Refill</h4>
        <span class="badge warning">Pending</span>
      </div>
      <div class="wf-body">
        <p><strong>Patient:</strong> John Doe (MRN #847291)</p>
        <p><strong>Medication:</strong> Lisinopril 10mg</p>
      </div>
      <div class="progress-bar">
        <div class="progress" style="width: 50%"></div>
      </div>
      <p class="text-muted status-text">Eligibility Checked - Awaiting Approval</p>
    </div>

    <div class="glass-card workflow-item">
      <div class="wf-header">
        <span class="icon">📅</span>
        <h4>Appointment Scheduling</h4>
        <span class="badge success">Confirmed</span>
      </div>
      <div class="wf-body">
        <p><strong>Patient:</strong> Sarah Smith</p>
        <p><strong>Provider:</strong> Dr. Sarah Jenkins</p>
      </div>
      <div class="progress-bar">
        <div class="progress" style="width: 100%; background: var(--success)"></div>
      </div>
      <p class="text-muted status-text">Notification Sent</p>
    </div>
  </div>
</div>
