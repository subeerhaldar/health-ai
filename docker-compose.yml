version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  orchestrator-api:
    container_name: orchestrator-api
    build:
      context: .
      dockerfile: src/Orchestrator.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    ports:
      - "5001:8080"
    depends_on:
      - rabbitmq
      - postgres

  ragservice-api:
    container_name: ragservice-api
    build:
      context: .
      dockerfile: src/RagService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5002:8080"
    depends_on:
      - postgres

  mcpclient-api:
    container_name: mcpclient-api
    build:
      context: .
      dockerfile: src/McpClient.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5003:8080"
    depends_on:
      - rabbitmq

  workflowengine-api:
    container_name: workflowengine-api
    build:
      context: .
      dockerfile: src/WorkflowEngine.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5004:8080"
    depends_on:
      - rabbitmq
      - postgres

  apigateway:
    container_name: apigateway
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5000:8080"
    depends_on:
      - orchestrator-api
      - ragservice-api
      - mcpclient-api
      - workflowengine-api

  frontend:
    image: nginx:alpine
    container_name: frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - apigateway
